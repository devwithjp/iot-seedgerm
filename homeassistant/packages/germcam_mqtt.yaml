# Mini Germination Chamber ESP32-CAM MQTT entities.
#
# To load this as a Home Assistant package, add this to configuration.yaml:
#
# homeassistant:
#   packages: !include_dir_named packages
#
# Then copy this file into /config/packages/germcam_mqtt.yaml and restart
# Home Assistant, or reload MQTT entities from Developer Tools if available.

mqtt:
  binary_sensor:
    - name: "Germcam 1 Online"
      unique_id: germcam_1_online
      state_topic: "germination/germcam-1/availability"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      device:
        identifiers: ["germcam-1"]
        name: "Germcam 1"
        manufacturer: "Mini Germination Chamber"
        model: "ESP32-CAM"

    - name: "Germcam 2 Online"
      unique_id: germcam_2_online
      state_topic: "germination/germcam-2/availability"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      device:
        identifiers: ["germcam-2"]
        name: "Germcam 2"
        manufacturer: "Mini Germination Chamber"
        model: "ESP32-CAM"

    - name: "Germsoil 1 Online"
      unique_id: germsoil_1_online
      state_topic: "germination/germsoil-1/availability"
      payload_on: "online"
      payload_off: "offline"
      device_class: connectivity
      device:
        identifiers: ["germsoil-1"]
        name: "Germsoil 1"
        manufacturer: "Mini Germination Chamber"
        model: "ESP32 Soil Moisture Node"

  sensor:
    - name: "Germcam 1 RSSI"
      unique_id: germcam_1_rssi
      state_topic: "germination/germcam-1/status"
      value_template: "{{ value_json.rssi }}"
      unit_of_measurement: "dBm"
      device_class: signal_strength
      state_class: measurement
      availability_topic: "germination/germcam-1/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device:
        identifiers: ["germcam-1"]

    - name: "Germcam 1 Uptime"
      unique_id: germcam_1_uptime_seconds
      state_topic: "germination/germcam-1/status"
      value_template: "{{ (value_json.uptime_ms / 1000) | round(0) }}"
      unit_of_measurement: "s"
      device_class: duration
      state_class: total_increasing
      availability_topic: "germination/germcam-1/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device:
        identifiers: ["germcam-1"]

    - name: "Germcam 1 Free Heap"
      unique_id: germcam_1_free_heap
      state_topic: "germination/germcam-1/status"
      value_template: "{{ value_json.free_heap }}"
      unit_of_measurement: "B"
      device_class: data_size
      state_class: measurement
      availability_topic: "germination/germcam-1/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device:
        identifiers: ["germcam-1"]

    - name: "Germcam 1 JPEG URL"
      unique_id: germcam_1_jpg_url
      state_topic: "germination/germcam-1/jpg_url"
      icon: "mdi:image"
      availability_topic: "germination/germcam-1/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device:
        identifiers: ["germcam-1"]

    - name: "Germcam 1 Stream URL"
      unique_id: germcam_1_stream_url
      state_topic: "germination/germcam-1/stream_url"
      icon: "mdi:video"
      availability_topic: "germination/germcam-1/availability"
      payload_available: "online"
      payload_not_available: "offline"
      device:
        identifiers: ["germcam-1"]

    - name: "Germcam 1 Soil Raw Moisture"
      unique_id: germcam_1_soil_raw_moisture
      state_topic: "germination/germcam-1/soil_raw"
      unit_of_measurement: "ADC"
